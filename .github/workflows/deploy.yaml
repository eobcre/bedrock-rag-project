name: Deploy SAM

on:
  push:
    branches:
      - main

    paths:
      - "backend/src/**"
      - "backend/template.yaml"
      - ".github/workflows/**"

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SAM CLI
        uses: aws-actions/setup-sam@v2

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      # test
      - name: Install backend dependencies
        working-directory: backend/src
        run: npm ci

      - name: Run Lambda tests
        working-directory: backend/src
        run: npm test

      - name: Remove test files before build
        run: rm -rf backend/src/test

      # sam
      - name: SAM build
        working-directory: backend
        run: sam build

      - name: SAM deploy
        working-directory: backend
        run: |
          sam deploy \
          --stack-name ${{ secrets.STACK_NAME }} \
          --s3-bucket ${{ secrets.SAM_BUCKET }} \
          --s3-prefix sam-rag-api \
          --region ${{ secrets.AWS_REGION }} \
          --capabilities CAPABILITY_IAM \
          --parameter-overrides \
            KnowledgeBaseId=${{ secrets.KNOWLEDGE_BASE_ID }} \
            ModelArn=${{ secrets.MODEL_ARN }} \
            OriginSecret=${{ secrets.ORIGIN_SECRET }} \
          --no-confirm-changeset \
          --no-fail-on-empty-changeset
