AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31

Parameters:
  KnowledgeBaseId:
    Type: String
    NoEcho: true
  ModelArn:
    Type: String
    NoEcho: true
  OriginSecret:
    Type: String
    NoEcho: true

Globals:
  Function:
    Runtime: nodejs24.x
    Timeout: 30
    MemorySize: 128

Resources:
  RagHttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      Name: sam-rag-api

    CorsConfiguration:
      AllowMethods:
        - POST
        - OPTIONS

      AllowHeaders:
        - Content-Type
        - x-api-key

      AllowOrigins:
        - "*"

  RagFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: sam-rag-api

      CodeUri: src/

      Handler: index.handler

      Environment:
        Variables:
          KNOWLEDGE_BASE_ID: !Ref KnowledgeBaseId
          MODEL_ARN: !Ref ModelArn
          ORIGIN_SECRET: !Ref OriginSecret

      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - bedrock:Retrieve
                - bedrock:RetrieveAndGenerate
                - bedrock:GetKnowledgeBase
                - bedrock:InvokeModel
              Resource: "*"

      Events:
        RagEndpoint:
          Type: HttpApi
          Properties:
            ApiId: !Ref RagHttpApi
            Path: /api/rag
            Method: POST

Outputs:
  ApiUrl:
    Value: !Sub "https://${RagHttpApi}.execute-api.${AWS::Region}.amazonaws.com/api/rag"